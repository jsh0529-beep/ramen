<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>매일신문 브랜드 쇼릴</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ink:#0d0c0b;--paper:#f3eee4;--red:#e4312b;--red2:#b81f1a;--mute:#8d867a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Noto Sans KR',sans-serif;color:var(--paper)}
#cam{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.L{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.abs{position:absolute}
.serif{font-family:'Noto Serif KR',serif;font-weight:900}
.sans{font-family:'Noto Sans KR',sans-serif;font-weight:900}
.lbl{font:700 22px 'Noto Sans KR';letter-spacing:.32em;text-transform:uppercase}
.ctr{left:0;right:0;text-align:center}
canvas{position:absolute;inset:0}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .c{position:absolute;font:700 16px 'Noto Sans KR';letter-spacing:.25em;opacity:.55}
.strip{position:absolute;overflow:hidden}
.strip > div{position:absolute;left:0;top:0}
.cell{position:absolute;background:var(--paper);color:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;
  font:900 64px 'Noto Sans KR';letter-spacing:-.03em;backface-visibility:hidden}
.band{position:absolute;left:-400px;width:2720px;height:150px;display:flex;align-items:center;white-space:nowrap;
  font:900 96px 'Noto Sans KR';letter-spacing:-.02em}
.card{position:absolute;width:300px;height:390px;background:var(--paper);border-radius:6px;padding:26px;color:var(--ink);
  box-shadow:0 30px 60px rgba(0,0,0,.45)}
.card .k{font:900 22px 'Noto Sans KR';color:var(--red);letter-spacing:.1em;margin-bottom:14px}
.card .hl{height:26px;background:var(--ink);margin-bottom:12px;border-radius:2px}
.card .ln{height:10px;background:#c9c2b4;margin-bottom:10px;border-radius:2px}
.card .im{height:120px;background:repeating-linear-gradient(45deg,#d8d0c1 0 6px,#cfc6b5 6px 12px);margin:16px 0}
</style>
</head>
<body>
<div id="cam">

<!-- S0 콜드 오픈: 붉은 점 -->
<div class="L" id="s0" style="background:var(--ink)">
  <div id="s0rules"></div>
  <div class="abs" id="dot" style="left:960px;top:540px;width:36px;height:36px;margin:-18px;border-radius:50%;background:var(--red)"></div>
  <div class="abs lbl" id="s0lbl" style="left:0;right:0;top:600px;text-align:center;color:var(--mute)">DAEGU · 06:00 AM</div>
</div>

<!-- S1 매 / 일 -->
<div class="L" id="s1" style="background:var(--red)">
  <div class="abs serif" id="s1han" style="left:0;right:0;top:230px;text-align:center;font-size:520px;line-height:1;color:var(--ink);opacity:0">每日</div>
  <div class="abs" id="s1ko" style="left:0;top:0;width:1920px;height:1080px"></div>
</div>

<!-- S2 오도미터 1946→2026 -->
<div class="L" id="s2" style="background:var(--paper)">
  <div class="abs lbl" style="left:120px;top:110px;color:var(--ink)">est. 1946.03.01 — 대구 대안동</div>
  <div class="abs lbl" style="right:120px;top:110px;color:var(--red)">남선경제신문 → 대구매일신문 → 매일신문</div>
  <div class="abs" id="odo" style="left:50%;top:270px;height:540px;margin-left:-760px;width:1520px;display:flex;gap:0"></div>
  <div class="abs" style="left:120px;right:120px;top:880px;height:4px;background:var(--ink)"></div>
  <div class="abs" id="odoBar" style="left:120px;top:880px;height:4px;width:0;background:var(--red)"></div>
</div>

<!-- S3 80 -->
<div class="L" id="s3" style="background:var(--ink)">
  <canvas id="c80" width="1920" height="1080"></canvas>
  <div class="abs" id="s3lines" style="left:1160px;top:300px;width:800px"></div>
  <div class="abs lbl" style="left:130px;top:880px;color:var(--mute)">창간 80주년 · 1946 — 2026</div>
</div>

<!-- S4 스플릿 플랩 그리드 -->
<div class="L" id="s4" style="background:var(--ink);perspective:1600px">
  <div id="grid"></div>
  <div class="abs ctr sans" id="s4a" style="top:430px;font-size:150px;letter-spacing:-.05em;color:var(--paper);opacity:0;text-shadow:0 0 40px rgba(0,0,0,.7)"></div>
</div>

<!-- S5 티커 밴드 -->
<div class="L" id="s5" style="background:var(--ink)"><div id="bands"></div></div>

<!-- S6 PICK -->
<div class="L" id="s6" style="background:#1a1816;perspective:1400px">
  <div id="cards" style="position:absolute;inset:0;transform-style:preserve-3d"></div>
  <div class="abs" id="reticle" style="width:420px;height:520px;border:6px solid var(--red);left:0;top:0;opacity:0"></div>
  <div class="abs ctr" id="pick" style="top:300px;opacity:0">
    <div class="sans" style="font-size:96px;letter-spacing:-.04em;color:var(--paper)">대한민국이</div>
    <div class="sans" style="font-size:300px;line-height:.9;letter-spacing:-.05em;color:var(--red)">PICK<span style="color:var(--paper);font-size:120px;letter-spacing:-.04em">한 뉴스</span></div>
  </div>
</div>

<!-- S7 1955 사설 -->
<div class="L" id="s7" style="background:var(--ink)">
  <div class="abs lbl" id="s7lbl" style="left:0;right:0;top:250px;text-align:center;color:var(--red)">1955. 9. 13. 社說 — 주필 최석채</div>
  <div class="abs ctr serif" id="s7t" style="top:370px;font-size:150px;letter-spacing:-.04em;line-height:1.2"></div>
  <svg class="abs" id="slash" viewBox="0 0 1920 1080" style="left:0;top:0;width:1920px;height:1080px;opacity:0">
    <path d="M-50 760 L720 560 L860 640 L1980 300" fill="none" stroke="#e4312b" stroke-width="22" stroke-linejoin="bevel"/>
  </svg>
</div>

<!-- S8 할 말은 한다 -->
<div class="L" id="s8" style="background:var(--paper);color:var(--ink)">
  <div class="abs serif" id="s8a" style="left:140px;top:250px;font-size:150px;letter-spacing:-.04em">권력 앞에서도,</div>
  <div class="abs serif" id="s8b" style="left:140px;top:470px;font-size:230px;letter-spacing:-.05em;color:var(--ink)">할 말은 한다.</div>
  <div class="abs" id="s8u" style="left:140px;top:790px;height:22px;width:0;background:var(--red)"></div>
  <div class="abs lbl" style="left:146px;top:860px;color:var(--mute)">정론직필 · 80년</div>
</div>

<!-- S9 빌드업: 햇살 -->
<div class="L" id="s9" style="background:var(--red)">
  <canvas id="rays" width="1920" height="1080"></canvas>
  <div class="abs ctr sans" id="s9w" style="top:380px;font-size:260px;letter-spacing:-.05em;color:var(--paper);line-height:1"></div>
  <div id="chips"></div>
</div>

<!-- S10 드롭: 해 뜨는 사시 -->
<div class="L" id="s10" style="background:var(--ink)">
  <canvas id="sun" width="1920" height="1080"></canvas>
  <div class="abs lbl ctr" id="s10l" style="top:210px;color:var(--paper);opacity:0">매일신문 사시 社是</div>
  <div class="abs ctr serif" id="s10a" style="top:300px;font-size:130px;letter-spacing:-.04em;color:var(--paper);opacity:0">땀과 사랑으로</div>
  <div class="abs ctr serif" id="s10b" style="top:470px;font-size:130px;letter-spacing:-.04em;color:var(--paper);opacity:0">겨레의 빛이 되리</div>
</div>

<!-- S11 로고 -->
<div class="L" id="s11" style="background:var(--paper);color:var(--ink)">
  <div class="abs" id="logoStrips" style="left:0;top:250px;width:1920px;height:300px"></div>
  <div class="abs ctr serif" id="lg2" style="top:585px;font-size:50px;font-weight:700;letter-spacing:1.1em;padding-left:1.1em;color:#3b362c;opacity:0">每日新聞</div>
  <div class="abs" id="lgbar" style="left:960px;top:680px;height:8px;width:0;background:var(--red)"></div>
  <div class="abs ctr sans" id="lg3" style="top:720px;font-size:54px;letter-spacing:-.03em;opacity:0">대한민국이 <span style="color:var(--red)">pick</span>한 뉴스</div>
  <div class="abs ctr lbl" id="lg4" style="top:830px;color:var(--mute);opacity:0">since 1946 · 창간 80주년 · imaeil.com</div>
</div>

<div id="hud">
  <div class="c" style="left:40px;top:34px">每日新聞 — BRAND REEL</div>
  <div class="c" id="tc" style="right:40px;top:34px"></div>
  <div class="c" style="left:40px;bottom:30px">DAEGU · GYEONGBUK · KOREA</div>
  <div class="c" id="bt" style="right:40px;bottom:30px"></div>
</div>
<div id="grain"></div>
<div id="flash"></div>
</div>

<script>
// ─────────── 유틸 ───────────
const BPM=120, B=60/BPM;                     // 1박 0.5초
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=x=>1-Math.pow(1-clamp(x),3);          // easeOutCubic
const eo5=x=>1-Math.pow(1-clamp(x),5);
const ei=x=>Math.pow(clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const expo=x=>{x=clamp(x);return x===1?1:1-Math.pow(2,-10*x)};
const expoIn=x=>{x=clamp(x);return x===0?0:Math.pow(2,10*x-10)};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pulse=(t,at,len=.25)=>{const d=t-at;return d>=0&&d<len?1-d/len:0};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;parent.appendChild(e);return e};

// 장면 구간 (초)
const SC=[['s0',0,2],['s1',2,4],['s2',4,6],['s3',6,8],['s4',8,12],['s5',12,14],['s6',14,16],['s7',16,18],['s8',18,20],['s9',20,24],['s10',24,27],['s11',27,30]];
// 카메라 흔들림을 줄 타격 지점
const HITS=[2,2.5,3,4,5.5,6,8,10,11,12,14,15,15.5,16,16.5,17,17.5,18,18.75,24,27,29];

// ─────────── S0 ───────────
const rules=[];{const r=rng(2),p=$('#s0rules');for(let i=0;i<14;i++){const d=el('div','abs',p);d.style.cssText=`left:0;height:${r()<.3?6:2}px;background:${r()<.25?'var(--red)':'var(--paper)'};top:${80+r()*920}px;width:1920px;transform-origin:left`;rules.push({d,at:Math.floor(i/3.5)*B+ (i%4)*.06,dir:i%2});}}

// ─────────── S1: 매·일 슬라이스 ───────────
const NS=9, s1strips=[];
{const p=$('#s1ko');
 for(let i=0;i<NS;i++){const s=el('div','strip',p);s.style.cssText=`left:0;top:${230+i*520/NS}px;width:1920px;height:${520/NS+1}px`;
   const inner=el('div','',s,'<span class="w1">매</span><span class="w2">일</span>');
   inner.style.cssText=`top:${-i*520/NS}px;width:1920px;height:520px;display:flex;justify-content:center;gap:40px;font:900 520px/1 'Noto Serif KR';color:var(--paper)`;
   s1strips.push({s,inner});}}

// ─────────── S2: 오도미터 ───────────
const odoCols=[];
{const p=$('#odo');
 for(let c=0;c<4;c++){const col=el('div','',p);col.style.cssText='position:relative;width:380px;height:540px;overflow:hidden';
   const reel=el('div','',col);reel.style.cssText="position:absolute;left:0;top:0;width:380px;font:900 540px/540px 'Noto Serif KR';text-align:center;color:var(--ink);letter-spacing:-.04em";
   let h='';for(let k=0;k<=40;k++)h+=`<div style="height:540px">${k%10}</div>`;reel.innerHTML=h;odoCols.push(reel);}}
function setOdo(year){ // 기계식 카운터: 아래 자리가 9→0 넘어갈 때만 윗자리가 굴러감
  const fr=year%1, Y=Math.floor(year);
  odoCols.forEach((r,i)=>{const p=Math.pow(10,3-i); const d=Math.floor(Y/p)%10;
    const lower=Y%p; const roll=(i===3||lower===p-1)?fr:0;
    r.style.transform=`translateY(${-(d+roll)*540}px)`;});
}

// ─────────── S3: 80 하프톤 ───────────
const c80=$('#c80').getContext('2d');
function draw80(t,p){
  const g=c80; g.clearRect(0,0,1920,1080);
  // 마스크: 80
  g.save(); g.font="900 900px 'Noto Serif KR'"; g.textBaseline='alphabetic';
  const x=110,y=930; g.lineWidth=5; g.strokeStyle='#f3eee4'; g.strokeText('80',x,y);
  g.globalCompositeOperation='source-over';
  // 하프톤 점을 80 모양으로 클립
  g.beginPath(); g.rect(0,0,1920,1080); g.clip();
  const off=document.createElement('canvas'); // 캐시
  g.restore();
  if(!draw80.mask){const m=document.createElement('canvas');m.width=1920;m.height=1080;const mg=m.getContext('2d');mg.font="900 900px 'Noto Serif KR'";mg.fillStyle='#fff';mg.fillText('80',x,y);draw80.mask=mg.getImageData(0,0,1920,1080).data;}
  const M=draw80.mask, step=18, fill=eo(p);
  for(let yy=0;yy<1080;yy+=step)for(let xx=0;xx<1060;xx+=step){
    if(M[((yy+9)*1920+(xx+9))*4]<128)continue;
    const level=clamp((fill*1.25)-(1-(yy-120)/820));             // 아래에서부터 차오름
    const wob=.15*Math.sin(xx*.02+t*6)*Math.cos(yy*.03-t*4);
    const r=clamp(level+wob)*step*.62; if(r<.5)continue;
    g.fillStyle=(yy>840-fill*80)?'#e4312b':'#f3eee4'; g.beginPath(); g.arc(xx+9,yy+9,r,0,7); g.fill();
  }
}
const s3words=[['80년,',6.5,'var(--paper)'],['매일,',7.0,'var(--paper)'],['아침을 기록하다.',7.5,'var(--red)']];
const s3els=s3words.map(([w,at,c])=>{const d=el('div','sans',$('#s3lines'),w);d.style.cssText=`font-size:120px;letter-spacing:-.05em;line-height:1.12;color:${c};opacity:0;white-space:nowrap`;return {d,at}});

// ─────────── S4: 그리드 ───────────
const COLS=6,ROWS=4,GW=1920/COLS,GH=1080/ROWS,gap=8;
const WORDS=['정치','경제','사회','국제','오피니언','스포츠','문화','사람','대구','경북','포토','영상','지면','속보','기획','현장','라이프','칼럼','인터뷰','데이터','날씨','교육','의료','산업'];
const cells=[];
{const r=rng(8),p=$('#grid');
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const c=el('div','cell',p);c.style.left=(i*GW+gap/2)+'px';c.style.top=(j*GH+gap/2)+'px';c.style.width=(GW-gap)+'px';c.style.height=(GH-gap)+'px';
   cells.push({c,i,j,ph:r(),seq:Array.from({length:20},()=>Math.floor(r()*WORDS.length)),style:Array.from({length:20},()=>r())});}}
function cellFace(cell,k){const w=WORDS[cell.seq[k%20]],s=cell.style[k%20];
  if(s<.18) return ['var(--red)','var(--paper)',w];
  if(s<.30) return ['var(--ink)','var(--red)','●'];
  if(s<.40) return ['var(--paper)','var(--ink)',`<span style="font-family:'Noto Serif KR';font-size:120px">${'每日新聞'[k%4]}</span>`];
  return ['var(--paper)','var(--ink)',w];}
const s4txt=[['세상의 모든 오늘을',9.95,10.95],['매일, 아침에.',11.0,12]];

// ─────────── S5: 밴드 ───────────
const BANDS=[{y:180,rot:-9,bg:'var(--red)',fg:'var(--paper)',txt:'대한민국이 PICK한 뉴스 ● ',sp:1},
             {y:450,rot:6,bg:'var(--paper)',fg:'var(--ink)',txt:'매일신문 每日新聞 ● ',sp:-1.3},
             {y:720,rot:-4,bg:'var(--ink)',fg:'var(--red)',txt:'SINCE 1946 · DAEGU · GYEONGBUK ● ',sp:.8,border:true}];
const bandEls=BANDS.map(b=>{const d=el('div','band',$('#bands'));d.style.background=b.bg;d.style.color=b.fg;d.style.top=b.y+'px';
  if(b.border)d.style.boxShadow='inset 0 0 0 4px var(--red)';
  const inner=el('div','',d,b.txt.repeat(14));inner.style.cssText='position:absolute;left:0;white-space:nowrap';return {d,inner,b}});

// ─────────── S6: 카드 ───────────
const CARDS=['정치','사회','경제','국제','문화','스포츠','오피니언','대구','경북','사람','포토','영상','속보','기획','칼럼','현장'];
const cardEls=[];
{const r=rng(15),p=$('#cards');
 CARDS.forEach((k,i)=>{const c=el('div','card',p,`<div class="k">${k}</div><div class="hl" style="width:${70+r()*30}%"></div><div class="hl" style="width:${40+r()*40}%"></div><div class="im"></div>${'<div class="ln"></div>'.repeat(5)}`);
   cardEls.push({c,x:(i%4-1.5)*430+(r()-.5)*90,y:(Math.floor(i/4)-1.5)*300+(r()-.5)*80,z:-2600-r()*2400,rz:(r()-.5)*14,sp:1400+r()*900});});}
const TARGET=5; // 락온할 카드

// ─────────── S7 ───────────
const s7words=[['학도를',16.0],['도구로',16.5],['이용하지 말라',17.0]];
const s7els=s7words.map(([w,at],i)=>{const d=el('span','',$('#s7t'),w);d.style.cssText='display:inline-block;opacity:0;margin:0 .14em';if(i===1)el('br','',$('#s7t'));return {d,at}});

// ─────────── S9: 햇살 + 단어 ───────────
const rays=$('#rays').getContext('2d');
const S9W=['대구','경북','대한민국','정론','직필','현장','기록','사람','내일','매일','매일','매일','매일','매일','매일','매일'];
function s9word(t){ // 가속: 20~22 박자, 22~23 8분, 23~23.5 16분
  let k; if(t<22) k=Math.floor((t-20)/B); else if(t<23) k=4+Math.floor((t-22)/(B/2)); else k=6+2+Math.floor((t-23)/(B/4));
  return S9W[Math.min(S9W.length-1,k)];}
const CHIPS=['1946 창간','창간 80주년','대구 서성로 20','조간 발행','지면 · 웹 · 영상','PDF 지면보기','포토갤러리','유튜브'];
const chipEls=CHIPS.map((c,i)=>{const d=el('div','abs',$('#chips'),c);d.style.cssText=`font:900 34px 'Noto Sans KR';padding:14px 26px;border-radius:999px;background:var(--ink);color:var(--paper);white-space:nowrap;opacity:0`;return {d,i}});
function drawRays(t){
  const g=rays; g.clearRect(0,0,1920,1080);
  const p=clamp((t-20)/4), spin=t*0.6+ei(p)*9, n=24;
  g.save(); g.translate(960,560);
  for(let i=0;i<n;i++){const a0=spin+i*2*Math.PI/n,a1=a0+Math.PI/n;
    g.fillStyle=i%2?'rgba(255,255,255,0)':'rgba(184,31,26,.95)'; g.beginPath(); g.moveTo(0,0); g.arc(0,0,2400,a0,a1); g.closePath(); g.fill();}
  g.fillStyle='#e4312b'; g.beginPath(); g.arc(0,0,180+60*Math.sin(t*Math.PI*4)*p,0,7); g.fill();
  g.restore();
}

// ─────────── S10: 해 ───────────
const sun=$('#sun').getContext('2d');
function drawSun(t){
  const g=sun, p=clamp((t-24)/3); g.clearRect(0,0,1920,1080);
  const cy=lerp(1500,700,expo(p*1.4)), R=lerp(380,520,eo(p));
  // 햇살 글로우
  const gr=g.createRadialGradient(960,cy,R*.8,960,cy,R*2.6);gr.addColorStop(0,'rgba(228,49,43,.55)');gr.addColorStop(1,'rgba(228,49,43,0)');
  g.fillStyle=gr; g.fillRect(0,0,1920,1080);
  // 인쇄 망점식 해: 가로 줄무늬로 채운 원
  g.save(); g.beginPath(); g.arc(960,cy,R,0,7); g.clip();
  g.fillStyle='#e4312b'; g.fillRect(0,0,1920,1080);
  for(let y=cy-R;y<cy+R;y+=16){const k=(y-(cy-R))/(2*R); const h=lerp(1,12,Math.pow(k,1.6)); g.fillStyle='#0d0c0b'; g.fillRect(0,y+16-h,1920,h*(k>.35?1:0));}
  g.restore();
  // 수평선
  g.fillStyle='#0d0c0b'; g.fillRect(0,860,1920,220);
  for(let i=0;i<8;i++){g.fillStyle=`rgba(243,238,228,${.5-i*.055})`; const y=870+i*i*3.2; const w=lerp(0,1920,expo((t-24.1-i*.05)/1.2)); g.fillRect(960-w/2,y,w,2);}
}

// ─────────── S11: 로고 스트립 ───────────
const LS=10, logoStrips=[];
{const p=$('#logoStrips');
 for(let i=0;i<LS;i++){const s=el('div','strip',p);const w=1400/LS;s.style.cssText=`left:${260+i*w}px;top:0;width:${w+1}px;height:300px`;
   const inner=el('div','',s,'매일신문');inner.style.cssText=`left:${-i*w}px;top:0;width:1400px;height:300px;text-align:center;font:900 290px/300px 'Noto Serif KR';letter-spacing:.04em;color:var(--ink)`;
   logoStrips.push({s,inner,i});}}

// ─────────── 메인 렌더 ───────────
window.render=function(t){
  for(const [id,a,b] of SC) $('#'+id).style.visibility=(t>=a&&t<b)?'visible':'hidden';

  // 카메라: 타격마다 짧은 흔들림 + 줌 펀치
  let sh=0,zp=0; for(const h of HITS){const q=pulse(t,h,.22); sh=Math.max(sh,q); zp=Math.max(zp,pulse(t,h,.35));}
  const k=Math.floor(t*120); const sx=Math.sin(k*1.7)*sh*14, sy=Math.cos(k*2.3)*sh*10;
  $('#cam').style.transform=`translate(${sx}px,${sy}px) scale(${1+zp*.018})`;
  $('#flash').style.opacity=Math.max(pulse(t,2,.12)*.8,pulse(t,24,.25),pulse(t,23.98,.1),pulse(t,27,.15)*.6,pulse(t,15.5,.1)*.5,pulse(t,17.5,.08)*.7);
  $('#grain').style.transform=`translate(${(k*37)%200-100}px,${(k*61)%200-100}px)`;
  const f=Math.floor(t*30); $('#tc').textContent=`00:00:${String(Math.floor(t)).padStart(2,'0')}:${String(f%30).padStart(2,'0')}`;
  $('#bt').textContent=`♩=${BPM}  BAR ${Math.floor(t/(4*B))+1}.${Math.floor(t/B)%4+1}`;
  $('#hud').style.color=(t>=2&&t<4)||(t>=18&&t<20)||(t>=27)||(t>=4&&t<6)?'#0d0c0b':'#f3eee4';
  $('#hud').style.opacity=t<.3||t>29.6?0:1;

  // S0
  if(t<2){
    const beat=Math.floor(t/B); const bp=pulse(t,beat*B,.3);
    const grow=expoIn((t-1.45)/.55);
    $('#dot').style.transform=`scale(${(1+bp*.7)*(1+grow*120)})`;
    rules.forEach(r=>{const q=(t-r.at)/.35; r.d.style.opacity=q<0?0:clamp(1-(t-r.at-.35)/.4);
      r.d.style.transform=`scaleX(${eo5(q)})`; r.d.style.transformOrigin=r.dir?'right':'left';});
    $('#s0lbl').style.opacity=clamp((t-.2)/.3)*(1-clamp((t-1.4)/.2));
    $('#s0lbl').style.letterSpacing=lerp(.6,.32,eo(t/1.2))+'em';
  }
  // S1
  if(t>=2&&t<4){
    const w1=$$('.w1'),w2=$$('.w2');
    const a1=eo5((t-2)/.3), a2=eo5((t-2.5)/.3);
    w1.forEach(e=>{e.style.opacity=t>=2?1:0;e.style.display='inline-block';e.style.transform=`scale(${lerp(1.6,1,a1)})`;});
    w2.forEach(e=>{e.style.opacity=t>=2.5?1:0;e.style.display='inline-block';e.style.transform=`scale(${lerp(1.6,1,a2)})`;});
    const sl=eio((t-3)/.45), out=expoIn((t-3.55)/.45);
    s1strips.forEach(({s,inner},i)=>{const dir=i%2?1:-1; inner.style.transform=`translateX(${dir*sl*(1500+i*70)}px)`;
      s.style.transform=`translateY(${-out*1300}px)`;});
    $('#s1han').style.opacity=clamp((t-3.12)/.18); $('#s1han').style.transform=`scale(${lerp(.9,1,eo((t-3)/.5))}) translateY(${-out*1300}px)`;
  }
  // S2
  if(t>=4&&t<6){
    const p=eio((t-4.05)/1.35); const year=lerp(1946,2026,p);
    setOdo(year);
    $('#odoBar').style.width=lerp(0,1680,p)+'px';
    $('#odo').style.transform=`scale(${lerp(1.08,1,eo((t-4)/.6))})`;
    const wipe=expoIn((t-5.55)/.45); $('#s2').style.clipPath=`inset(0 0 0 ${wipe*100}%)`;
  } else $('#s2').style.clipPath='none';
  // S3
  if(t>=6&&t<8){
    draw80(t,(t-6)/1.3);
    s3els.forEach(({d,at})=>{const q=eo5((t-at)/.35);d.style.opacity=t>=at?1:0;d.style.transform=`translateX(${(1-q)*220}px)`;});
    const out=expoIn((t-7.75)/.25); $('#s3').style.transform=`scale(${1+out*2.2})`; $('#s3').style.opacity=1-out;
  }
  // S4
  if(t>=8&&t<12){
    const step=B/2; // 8분음표마다 뒤집힘
    cells.forEach(cell=>{
      const intro=eo5((t-8-(cell.i+cell.j)*.035)/.35);
      const flipT=(t-8+cell.ph*step*2)/step; const kk=Math.floor(flipT); const fr=flipT-kk;
      const active=((kk+cell.i*3+cell.j*5)%3===0);
      const ang=active? (fr<.5? -fr*180 : (1-fr)*180) : 0;
      const face=cellFace(cell,active&&fr>=.5?kk+1:kk - ((kk+cell.i*3+cell.j*5)%3===1?0:0));
      cell.c.style.background=face[0];cell.c.style.color=face[1];cell.c.innerHTML=face[2];
      const merge=eio((t-9.9)/.25)*(1-eio((t-11.9)/.1));
      cell.c.style.transform=`translateY(${(1-intro)*GH}px) rotateX(${ang}deg) scale(${1-merge*.08})`;
      cell.c.style.opacity=(1-merge*.72)*intro;
    });
    const a=$('#s4a'); let shown=null;
    for(const [w,a0,a1] of s4txt) if(t>=a0&&t<a1) shown=[w,a0];
    if(shown){a.textContent=shown[0];const q=eo5((t-shown[1])/.3);a.style.opacity=1;a.style.transform=`scale(${lerp(1.3,1,q)})`;a.style.letterSpacing=lerp(.05,-.05,q)+'em';}
    else a.style.opacity=0;
  }
  // S5
  if(t>=12&&t<14){
    const p=(t-12)/2;
    const speed=t<13.5?1:lerp(1,.15,eo((t-13.5)/.3));
    bandEls.forEach(({d,inner,b},i)=>{
      const intro=eo5((t-12-i*.12)/.35);
      const pos=(t-12)*900*b.sp*speed+(t>=13.5?0:0);
      d.style.transform=`translateX(${(1-intro)*(i%2?2400:-2400)}px) rotate(${b.rot}deg)`;
      inner.style.transform=`translateX(${-1200+((pos%1200)+1200)%1200 - 1200}px)`;
    });
    const zoom=expoIn((t-13.55)/.45); $('#bands').style.transform=`scale(${1+zoom*6})`; $('#bands').style.transformOrigin='40% 22%';
  } else $('#bands').style.transform='none';
  // S6
  if(t>=14&&t<16){
    const lt=t-14;
    cardEls.forEach((c,i)=>{
      let z=c.z+lt*c.sp; if(i===TARGET) z=lerp(-3000,-300,eo5(lt/1.0));
      const lock=i===TARGET?eo5((t-15)/.3):0;
      const x=lerp(c.x,0,lock), y=lerp(c.y,0,lock);
      const flip=i===TARGET?eio((t-15.25)/.25)*180:0;
      c.c.style.transform=`translate3d(${810+x}px,${345+y}px,${z}px) rotateZ(${c.rz*(1-lock)}deg) rotateY(${flip}deg)`;
      c.c.style.opacity=(i===TARGET?1:clamp(1-(t-15.1)/.2))*clamp((z+4800)/1200);
      c.c.style.zIndex=Math.round(z+5000);
    });
    const ret=$('#reticle'); const rs=clamp((t-14.45)/.2);
    // 리티클이 카드들을 훑다가 타깃에 락온
    const scan=[[300,200],[1300,180],[520,600],[1250,560]]; const si=Math.min(3,Math.floor((t-14.45)/.14));
    const lockR=eo5((t-14.95)/.2);
    const [rx,ry]=scan[Math.max(0,si)];
    ret.style.left=lerp(rx,750,lockR)+'px'; ret.style.top=lerp(ry,280,lockR)+'px';
    ret.style.opacity=rs*(1-clamp((t-15.45)/.08)); ret.style.transform=`scale(${lerp(1.3,1,lockR)})`;
    const pk=$('#pick'); const pq=eo5((t-15.5)/.3); pk.style.opacity=t>=15.5?1:0; pk.style.transform=`scale(${lerp(1.5,1,pq)})`;
    $('#cards').style.opacity=1-clamp((t-15.5)/.1);
  }
  // S7
  if(t>=16&&t<18){
    s7els.forEach(({d,at})=>{const q=eo5((t-at)/.25);d.style.opacity=t>=at?1:0;d.style.transform=`translateY(${(1-q)*60}px)`;d.style.filter=`blur(${(1-q)*8}px)`;});
    const sl=$('#slash'); sl.style.opacity=t>=17.5?1:0;
    const path=sl.querySelector('path'); const L=2400; path.style.strokeDasharray=L; path.style.strokeDashoffset=L*(1-expo((t-17.5)/.12));
    const crack=t>=17.5; $('#s7t').style.transform=crack?`translate(${(t-17.5)*-40}px,${(t-17.5)*30}px) rotate(${(t-17.5)*-2}deg)`:'none';
    $('#s7lbl').style.opacity=clamp((t-16)/.2);
  }
  // S8
  if(t>=18&&t<20){
    const a=eo5((t-18)/.35), b2=eo5((t-18.75)/.3);
    $('#s8a').style.transform=`translateX(${(1-a)*-500}px)`; $('#s8a').style.opacity=a;
    $('#s8b').style.transform=`scale(${lerp(1.4,1,b2)})`; $('#s8b').style.opacity=t>=18.75?1:0; $('#s8b').style.transformOrigin='left center';
    $('#s8u').style.width=lerp(0,1370,expo((t-19.1)/.4))+'px';
    const out=expoIn((t-19.6)/.4); $('#s8').style.clipPath=`circle(${lerp(160,0,out)}% at 50% 55%)`;
  } else $('#s8').style.clipPath='none';
  // S9
  if(t>=20&&t<24){
    drawRays(t);
    const w=$('#s9w'); const word=s9word(t); if(w.textContent!==word)w.textContent=word;
    const per=t<22?B:t<23?B/2:B/4; const ph=((t-20)%per)/per;
    w.style.transform=`scale(${lerp(1.25,1,eo5(ph*2))})`; w.style.opacity=t<23.5?1:0;
    chipEls.forEach(({d,i})=>{const at=20.25+i*.25; const q=eo5((t-at)/.4);
      const ang=i*2.4+t*.3; const rad=lerp(900,380+ (i%3)*70,q);
      d.style.left=(960+Math.cos(ang)*rad*1.35-120)+'px'; d.style.top=(540+Math.sin(ang)*rad*.8-30)+'px';
      d.style.opacity=t>=at&&t<23.5?1:0; d.style.transform=`scale(${lerp(.4,1,q)})`;});
    $('#s9').style.background=t>=23.5?'var(--ink)':'var(--red)'; $('#rays').style.opacity=t>=23.5?0:1;
  }
  // S10
  if(t>=24&&t<27){
    drawSun(t);
    $('#s10l').style.opacity=clamp((t-24.3)/.3);
    [['#s10a',24.5],['#s10b',25.5]].forEach(([s,at])=>{const q=eo((t-at)/.8);const e=$(s);e.style.opacity=q;e.style.letterSpacing=lerp(.2,-.04,q)+'em';e.style.filter=`blur(${(1-q)*10}px)`;});
    const out=expoIn((t-26.6)/.4); $('#s10').style.clipPath=`inset(${out*50}% 0 ${out*50}% 0)`;
  } else $('#s10').style.clipPath='none';
  // S11
  if(t>=27){
    logoStrips.forEach(({inner,i})=>{const q=eo5((t-27-i*.035)/.55); const dir=i%2?1:-1; inner.style.transform=`translateY(${dir*(1-q)*340}px)`;});
    $('#lg2').style.opacity=eo((t-27.8)/.4); $('#lg2').style.letterSpacing=lerp(1.6,1.1,eo((t-27.8)/.6))+'em';
    const bw=lerp(0,520,expo((t-28.2)/.5)); $('#lgbar').style.width=bw+'px'; $('#lgbar').style.marginLeft=(-bw/2)+'px';
    const l3=eo5((t-28.5)/.4); $('#lg3').style.opacity=l3; $('#lg3').style.transform=`translateY(${(1-l3)*30}px)`;
    $('#lg4').style.opacity=eo((t-28.8)/.4);
    const hit=pulse(t,29,.4); $('#logoStrips').style.transform=`scale(${1+hit*.03})`;
    $('#cam').style.filter=`brightness(${1-clamp((t-29.75)/.25)})`;
  } else $('#cam').style.filter='none';
};
window.DURATION=30;
window.render(0);
</script>
