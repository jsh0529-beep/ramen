<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>매일신문 — 요즘 버전</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--ink:#0e0e0d;--paper:#edeae4;--red:#ff4f1a;--lime:#ff4f1a;--blue:#1c1c1b;--pink:#d6d1c8;--violet:#262523;
  --f:'Noto Sans KR','Noto Color Emoji',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:var(--f);color:#fff}
#cam{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.L{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.abs{position:absolute}
.ctr{left:0;right:0;text-align:center}
.b9{font-weight:900;letter-spacing:-.05em}
canvas{position:absolute;inset:0}
.glass{background:rgba(237,234,228,.14);color:#edeae4!important;border:1.5px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);border-radius:44px;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sticker{position:absolute;display:inline-flex;align-items:center;gap:12px;padding:18px 34px;border-radius:999px;font:900 54px var(--f);letter-spacing:-.03em;
  border:2px solid rgba(255,255,255,.18);white-space:nowrap}
.pill{display:inline-block;padding:10px 26px;border-radius:999px;font:900 34px var(--f)}
.w{position:absolute;border-radius:48px;overflow:hidden;padding:38px}
.bub{position:absolute;max-width:760px;padding:28px 38px;border-radius:44px;font:700 52px var(--f);letter-spacing:-.03em;line-height:1.3}
.card{position:absolute;left:140px;top:560px;width:800px;height:1000px;border-radius:56px;padding:60px;box-shadow:0 40px 80px rgba(0,0,0,.35)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="cam">
<canvas id="mesh" width="270" height="480" style="width:1080px;height:1920px;filter:blur(40px);transform:scale(1.2)"></canvas>

<!-- S1 잠금화면 -->
<div class="L" id="s1">
  <div class="abs ctr" style="top:250px;font:700 44px var(--f);color:rgba(255,255,255,.85)">오늘 아침</div>
  <div class="abs ctr b9" id="clock" style="top:300px;font-size:300px;line-height:1;color:#fff">06:00</div>
  <div id="notis"></div>
</div>

<!-- S2 POV -->
<div class="L" id="s2">
  <div class="abs b9" id="pov" style="left:90px;top:520px;font-size:150px;color:var(--lime)">POV:</div>
  <div class="abs b9" id="p1" style="left:90px;top:720px;font-size:170px;line-height:1.05">너 아직도</div>
  <div class="abs b9" id="p2" style="left:90px;top:910px;font-size:170px;line-height:1.05">신문 <span style="background:var(--lime);color:var(--ink);padding:0 .12em;border-radius:.12em">안 봄?</span></div>
  <div class="abs" id="eyes" style="left:700px;top:1210px;font-size:220px">👀</div>
</div>

<!-- S3 신문 = 아재 → 힙 -->
<div class="L" id="s3" style="background:var(--paper);color:var(--ink)">
  <div class="abs b9" style="left:90px;top:470px;font-size:190px">신문 =</div>
  <div class="abs b9" id="ajae" style="left:90px;top:700px;font-size:190px;color:#8a8680">아재 👴</div>
  <svg class="abs" id="scribble" viewBox="0 0 1080 1920" style="left:0;top:0;width:1080px;height:1920px">
    <path d="M60 820 C 250 740, 420 900, 620 780 S 900 840, 960 760 M80 900 C 300 820, 520 960, 700 840 S 920 900, 980 830" fill="none" stroke="#ff3b30" stroke-width="34" stroke-linecap="round"/></svg>
  <div class="sticker" id="hip" style="left:170px;top:1010px;background:var(--red);color:#fff;font-size:150px;padding:18px 60px;border:0">힙 😎</div>
  <div id="tags"></div>
</div>

<!-- S4 벤토 위젯 -->
<div class="L" id="s4">
  <div class="abs b9" id="s4t" style="left:70px;top:190px;font-size:84px">오늘의 매일신문 ✦</div>
  <div class="w" id="w1" style="left:60px;top:340px;width:465px;height:465px;background:var(--paper);color:var(--ink)">
    <div style="font:700 36px var(--f);opacity:.8">SINCE</div><div class="b9" style="font-size:170px;line-height:1">1946</div><div style="font:700 34px var(--f);margin-top:14px;opacity:.85">대구 대안동에서 첫 호</div></div>
  <div class="w" id="w2" style="left:555px;top:340px;width:465px;height:465px;background:var(--red);color:#fff">
    <div class="b9" style="font-size:230px;line-height:.95">80<span style="font-size:90px">th</span></div><div class="b9" style="font-size:50px;margin-top:20px">창간 80주년 🎉</div></div>
  <div class="w" id="w3" style="left:60px;top:835px;width:960px;height:360px;background:#0e0e0d;border:1.5px solid rgba(255,255,255,.1)">
    <div style="display:flex;gap:40px;align-items:center">
      <div style="width:240px;height:240px;border-radius:32px;background:var(--red);display:flex;align-items:center;justify-content:center;font:900 110px 'Noto Serif KR'">每日</div>
      <div style="flex:1"><div style="font:700 32px var(--f);color:var(--lime)">NOW READING</div><div class="b9" style="font-size:72px;margin:6px 0">매일신문</div><div style="font:500 36px var(--f);opacity:.7">오늘 아침 1면 · 대구·경북</div>
        <div style="height:12px;background:#333;border-radius:9px;margin-top:30px;overflow:hidden"><div id="prog" style="height:12px;background:var(--lime);width:0"></div></div></div></div></div>
  <div class="w" id="w4" style="left:60px;top:1225px;width:590px;height:420px;background:var(--pink);color:var(--ink)">
    <div style="font:700 36px var(--f)">대한민국이</div><div class="b9" style="font-size:190px;line-height:1">PICK</div><div class="b9" style="font-size:60px">한 뉴스 📌</div></div>
  <div class="w" id="w5" style="left:680px;top:1225px;width:340px;height:420px;background:var(--paper);color:var(--ink)">
    <div style="font-size:90px">📰</div><div class="b9" style="font-size:56px;line-height:1.2;margin-top:18px">종이<br>웹<br>유튜브</div></div>
</div>

<!-- S5 채팅 -->
<div class="L" id="s5" style="background:#edeae4;color:var(--ink)">
  <div class="abs" style="left:0;right:0;top:0;height:230px;background:#fff;display:flex;align-items:flex-end;padding:0 60px 40px;font:900 50px var(--f)">‹ &nbsp;우리 동네 뉴스방 <span style="color:#999;margin-left:14px">4</span></div>
  <div id="chat"></div>
</div>

<!-- S6 스와이프 -->
<div class="L" id="s6" style="background:var(--violet)">
  <div id="swipes"></div>
  <div class="abs ctr b9" id="sw1" style="top:170px;font-size:100px;opacity:0">숏폼은 넘기고,</div>
  <div class="abs ctr b9" id="sw2" style="top:1640px;font-size:120px;opacity:0;color:var(--lime)">신문은 남긴다.</div>
</div>

<!-- S7 갓생 루틴 -->
<div class="L" id="s7" style="background:var(--ink)">
  <div class="abs b9" style="left:80px;top:300px;font-size:96px;line-height:1.1">80년차 신문의<br><span style="color:var(--lime)">갓생 루틴</span> ✔︎</div>
  <div id="todo" style="position:absolute;left:80px;top:640px;width:920px"></div>
</div>

<!-- S8 빌드업: 3D 텍스트 링 + 마키 -->
<div class="L" id="s8" style="background:var(--blue);perspective:1400px">
  <div id="mq"></div>
  <div id="ring" style="position:absolute;left:540px;top:960px;transform-style:preserve-3d"></div>
</div>

<!-- S9 드롭: 로고 리피트 -->
<div class="L" id="s9" style="background:var(--ink)">
  <div id="rep"></div>
  <div class="abs ctr" id="big" style="top:760px">
    <div style="font:900 210px 'Noto Serif KR';letter-spacing:.02em;line-height:1;background:linear-gradient(180deg,#ffffff 0%,#edeae4 45%,#9d978c 100%);-webkit-background-clip:text;color:transparent">매일신문</div>
  </div>
  <div id="stk"></div>
</div>

<!-- S10 엔딩 -->
<div class="L" id="s10">
  <div class="abs ctr" id="e1" style="top:640px"><div style="font:900 200px 'Noto Serif KR';letter-spacing:.03em;line-height:1">매일신문</div>
    <div style="font:700 44px 'Noto Serif KR';letter-spacing:.9em;padding-left:.9em;margin-top:24px;opacity:.85">每日新聞</div></div>
  <div class="abs ctr" id="e2" style="top:1010px"><span class="pill" style="background:var(--red);color:#fff;font-size:52px;padding:16px 40px">대한민국이 pick한 뉴스 📌</span></div>
  <div class="abs ctr" id="e3" style="top:1190px"><span id="cta" class="pill" style="background:#fff;color:var(--ink);font-size:58px;padding:26px 60px;box-shadow:0 12px 0 rgba(0,0,0,.25)">구독 ㄱㄱ → imaeil.com</span></div>
  <div class="abs" id="tap" style="width:160px;height:160px;border-radius:50%;border:4px solid #edeae4;left:460px;top:1170px;opacity:0"></div>
  <div class="abs ctr" id="e4" style="top:1400px;font:700 34px var(--f);letter-spacing:.2em;opacity:.8">SINCE 1946 · 창간 80주년</div>
</div>

<div id="grain"></div>
<div id="flash"></div>
</div>

<script>
const BPM=140, B=60/BPM, BAR=4*B, b=x=>x*BAR;
const clamp=(x,a=0,c=1)=>Math.min(c,Math.max(a,x)), lerp=(a,c,t)=>a+(c-a)*t;
const eo=x=>1-Math.pow(1-clamp(x),3), eo5=x=>1-Math.pow(1-clamp(x),5), ei=x=>Math.pow(clamp(x),3);
const expo=x=>{x=clamp(x);return x===1?1:1-Math.pow(2,-10*x)}, expoIn=x=>{x=clamp(x);return x===0?0:Math.pow(2,10*x-10)};
const spring=x=>{if(x<=0)return 0;return 1-Math.exp(-7*x)*Math.cos(13*x)};       // 통통 튀는 등장
const pulse=(t,at,len=.2)=>{const d=t-at;return d>=0&&d<len?1-d/len:0};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;parent.appendChild(e);return e};
const pop=(e,t,at,from=.3)=>{const s=spring((t-at)*1.6);e.style.opacity=t>=at?1:0;e.style.transform=`scale(${lerp(from,1,s)})`;return s};

const SC=[['s1',0,b(1)],['s2',b(1),b(2)],['s3',b(2),b(4)],['s4',b(4),b(6)],['s5',b(6),b(8)],['s6',b(8),b(10)],['s7',b(10),b(12)],['s8',b(12),b(14)],['s9',b(14),b(16)],['s10',b(16),99]];
const HITS=[b(1),b(1)+2*B,b(2)+2*B,b(2)+3*B,b(4),b(6),b(8),b(9),b(10),b(12),b(14),b(14)+2*B,b(15),b(16)];

// ─── 메시 그라데이션 배경 ───
const mesh=$('#mesh').getContext('2d');
const PALS={cool:['#3b3935','#24231f','#57534c','#0e0e0d'],acid:['#4a4741','#2b2a26','#6b665d','#161614'],dark:['#3b3935','#24231f','#4f4b44','#0e0e0d']};
function drawMesh(t,pal){
  const g=mesh; g.fillStyle=pal[3]; g.fillRect(0,0,270,480);
  pal.slice(0,3).forEach((c,i)=>{const x=135+Math.sin(t*.9+i*2.1)*100, y=240+Math.cos(t*.7+i*1.7)*170, r=190+30*Math.sin(t*1.3+i);
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c); gr.addColorStop(1,c+'00'); g.fillStyle=gr; g.fillRect(0,0,270,480);});
}

// ─── S1 알림 ───
const NOTI=[['매','매일신문','오늘 아침 뉴스가 도착했어요 📰','지금',B*1],['💬','단톡방','야 오늘 1면 봤냐 ㅋㅋ','지금',B*2],['🔔','알림','읽지 않은 알림 99+','1분 전',B*3]];
const notiEls=NOTI.map(([ic,app,msg,time,at],i)=>{const d=el('div','abs glass',$('#notis'),
  `<div style="display:flex;gap:28px;align-items:center"><div style="width:110px;height:110px;border-radius:28px;background:${i?'#fff':'#ff3b30'};color:${i?'#111':'#fff'};display:flex;align-items:center;justify-content:center;font:900 60px 'Noto Serif KR','Noto Color Emoji'">${ic}</div>
   <div style="flex:1"><div style="display:flex;justify-content:space-between;font:700 34px var(--f);opacity:.6"><span>${app}</span><span>${time}</span></div><div style="font:700 44px var(--f);margin-top:6px">${msg}</div></div></div>`);
  d.style.cssText+=`;left:50px;width:980px;padding:34px 40px;top:${720+i*230}px`;return {d,at}});

// ─── S3 해시태그 ───
const TAGS=[['#텍스트힙','#0e0e0d','#edeae4',80,1380,-6],['#종이감성','#d6d1c8','#0e0e0d',520,1470,5],['#아날로그','#0e0e0d','#ff4f1a',160,1590,3],['#갓생','#ff4f1a','#fff',620,1640,-8]];
const tagEls=TAGS.map(([tx,bg,fg,x,y,r],i)=>{const d=el('div','sticker',$('#tags'),tx);d.style.cssText+=`;left:${x}px;top:${y}px;background:${bg};color:${fg}`;return {d,r,at:b(3)+2*B+i*B/2}});

// ─── S5 채팅 ───
const CHAT=[['L','민지','야 오늘 매일신문 봤어?',b(6)+B*.5],['R','','ㅇㅇ 1면 ㄹㅇ 미쳤음 🔥',b(6)+B*2],['L','준호','우리 동네 얘기 나옴 ㄷㄷ',b(6)+B*3.2],['R','','링크 ㄱㄱ',b(7)+B*.4]];
const chatEls=CHAT.map(([side,name,msg,at],i)=>{const y=330+i*210;
  const d=el('div','bub',$('#chat'),(name?`<div style="font:700 30px var(--f);color:#777;margin-bottom:6px">${name}</div>`:'')+msg);
  d.style.cssText+=side==='L'?`;left:60px;top:${y}px;background:#fff`:`;right:60px;top:${y}px;background:var(--ink);color:#edeae4`;
  const typing=el('div','bub',$('#chat'),'<span class="dt">●</span> <span class="dt">●</span> <span class="dt">●</span>');
  typing.style.cssText+=side==='L'?`;left:60px;top:${y+(name?40:0)}px;background:#fff;color:#999;font-size:36px`:`;right:60px;top:${y}px;background:var(--ink);color:#888;font-size:36px`;
  return {d,typing,at,side}});
const link=el('div','abs',$('#chat'),`<div style="background:#fff;border-radius:40px;overflow:hidden;width:820px;box-shadow:0 20px 40px rgba(0,0,0,.12)">
  <div style="height:300px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font:900 120px 'Noto Serif KR';color:#fff">매일신문</div><div style="font:700 30px var(--f);color:var(--lime);letter-spacing:.3em;margin-top:10px">每日新聞 · SINCE 1946</div></div>
  <div style="padding:30px 40px"><div style="font:900 46px var(--f)">대한민국이 pick한 뉴스</div><div style="font:500 32px var(--f);color:#888;margin-top:8px">imaeil.com</div></div></div>`);
link.style.cssText+=';right:60px;top:1180px';
const react=el('div','sticker',$('#chat'),'👍 3');react.style.cssText+=';left:170px;top:1640px;background:#fff;color:var(--ink)';

// ─── S6 스와이프 카드 ───
const SW=[['정치','#1c1c1b','#edeae4'],['경제','#d6d1c8','#0e0e0d'],['사회','#0e0e0d','#edeae4'],['국제','#edeae4','#0e0e0d'],['스포츠','#ff4f1a','#fff'],['문화','#2e2d2a','#edeae4'],['오피니언','#bdb6aa','#0e0e0d'],['사람','#0e0e0d','#ff4f1a']];
const swEls=SW.map(([k,bg,fg],i)=>{const c=el('div','card',$('#swipes'),`<div class="b9" style="font-size:44px;opacity:.7">매일신문 · ${String(i+1).padStart(2,'0')}</div><div class="b9" style="font-size:190px;line-height:1.05;margin-top:40px">${k}</div>
  ${'<div style="height:26px;border-radius:13px;background:currentColor;opacity:.18;margin-top:34px"></div>'.repeat(5)}`);
  c.style.background=bg;c.style.color=fg;c.style.zIndex=100-i;return c});
const keep=el('div','card',$('#swipes'),`<div class="b9" style="font-size:44px;color:var(--red)">1면 · 오늘 아침</div><div style="font:900 170px 'Noto Serif KR';line-height:1.05;margin-top:40px">매일<br>신문</div>
  <div class="b9" style="font-size:54px;margin-top:40px">대한민국이 pick한 뉴스</div>${'<div style="height:22px;border-radius:11px;background:#111;opacity:.14;margin-top:28px"></div>'.repeat(4)}`);
keep.style.background='var(--paper)';keep.style.color='var(--ink)';keep.style.zIndex=0;

// ─── S7 루틴 ───
const TODO=[['매일 아침 발행','since 1946'],['대구·경북 현장 취재','우리 동네가 1면'],['권력 앞에서도 할 말','1955년 사설 「학도를 도구로 이용하지 말라」'],['종이 · 웹 · 유튜브','어디서든 매일신문']];
const todoEls=TODO.map(([a,s],i)=>{const d=el('div','',$('#todo'),`<div style="display:flex;gap:34px;align-items:center;margin-bottom:58px">
  <div class="box" style="width:110px;height:110px;border-radius:30px;border:7px solid #fff;flex:none;display:flex;align-items:center;justify-content:center;font:900 76px var(--f);color:var(--ink)"></div>
  <div><div class="b9" style="font-size:66px">${a}</div><div style="font:500 34px var(--f);opacity:.65;margin-top:6px">${s}</div></div></div>`);return {d,at:b(10)+B+i*B*1.5}});

// ─── S8 3D 텍스트 링 + 마키 ───
const RN=12, ringEls=[];
for(let i=0;i<RN;i++){const d=el('div','b9',$('#ring'),i%3===2?'신문':'매일');d.style.cssText=`position:absolute;left:-200px;top:-95px;width:400px;height:190px;display:flex;align-items:center;justify-content:center;font-size:140px;
  background:${i%2?'var(--paper)':'var(--ink)'};color:${i%2?'var(--ink)':(i%3===2?'var(--red)':'var(--paper)')};border-radius:30px;border:2px solid rgba(255,255,255,.12);backface-visibility:hidden`;ringEls.push(d);}
const MQ=['NEWS EVERY MORNING ✦ ','매일 · 매일 · 매일 ✦ ','대한민국이 PICK한 뉴스 ✦ ','SINCE 1946 ✦ 80TH ✦ '];
const mqEls=MQ.map((m,i)=>{const d=el('div','abs b9',$('#mq'),m.repeat(10));d.style.cssText+=`;left:0;top:${160+i*(i<2?140:0)+(i>=2?1440+(i-2)*140:0)}px;font-size:110px;white-space:nowrap;color:${i%2?'rgba(237,234,228,.35)':'#edeae4'}`;return d});

// ─── S9 로고 리피트 + 스티커 ───
const repEls=[];for(let j=0;j<12;j++){const d=el('div','abs',$('#rep'),'매일신문 매일신문 매일신문');d.style.cssText=`left:-120px;top:${j*165}px;font:900 150px 'Noto Serif KR';white-space:nowrap;letter-spacing:.02em`;repEls.push(d);}
const STK=[['since 1946','#edeae4','#0e0e0d',90,420,-8],['80th','#ff4f1a','#fff',640,560,7],['대한민국이 pick한 뉴스','#262523','#edeae4',120,1120,-4],['종이 · 웹 · 유튜브','#d6d1c8','#0e0e0d',300,1300,5]];
const stkEls=STK.map(([tx,bg,fg,x,y,r],i)=>{const d=el('div','sticker',$('#stk'),tx);d.style.cssText+=`;left:${x}px;top:${y}px;background:${bg};color:${fg}`;return {d,r,at:b(15)+i*B/2}});

window.render=function(t){
  for(const [id,a,c] of SC) $('#'+id).style.visibility=(t>=a&&t<c)?'visible':'hidden';
  const k=Math.floor(t*120);
  let sh=0,zp=0; for(const h of HITS){sh=Math.max(sh,pulse(t,h,.18)); zp=Math.max(zp,pulse(t,h,.3));}
  $('#cam').style.transform=`translate(${Math.sin(k*1.7)*sh*16}px,${Math.cos(k*2.3)*sh*12}px) scale(${1+zp*.025})`;
  $('#flash').style.opacity=Math.max(pulse(t,b(1),.1)*.6,pulse(t,b(14),.18),pulse(t,b(16),.12)*.5);
  $('#grain').style.transform=`translate(${(k*37)%200-100}px,${(k*61)%200-100}px)`;
  const pal=t<b(4)?PALS.cool:t<b(12)?PALS.acid:PALS.dark; drawMesh(t,pal);
  $('#mesh').style.visibility=(t<b(2)||(t>=b(4)&&t<b(6))||t>=b(16))?'visible':'hidden';

  // S1
  if(t<b(1)){
    $('#clock').style.transform=`scale(${1+pulse(t,0,.4)*.05})`;
    notiEls.forEach(({d,at})=>{const s=spring((t-at)*1.8);d.style.opacity=t>=at?1:0;d.style.transform=`translateY(${(1-s)*-160}px) scale(${lerp(.9,1,s)})`;});
  }
  // S2
  if(t>=b(1)&&t<b(2)){
    const l=t-b(1);
    pop($('#pov'),t,b(1),.5);
    [['#p1',b(1)+B],['#p2',b(1)+2*B]].forEach(([s,at])=>{const e=$(s);const q=eo5((t-at)/.18);e.style.opacity=t>=at?1:0;e.style.transform=`translateX(${(1-q)*-300}px)`;});
    const gl=pulse(t,b(1)+2*B,.35); const r=rng(k)();
    $('#p2').style.textShadow=gl?`${(r-.5)*40*gl}px 0 #ff4f1a, ${-(r-.5)*40*gl}px 0 rgba(237,234,228,.6)`:'none';
    const e=$('#eyes'); const s=pop(e,t,b(1)+3*B,.2); e.style.transform+=` rotate(${Math.sin(t*20)*6}deg)`;
  }
  // S3
  if(t>=b(2)&&t<b(4)){
    const aj=$('#ajae'); const q=eo5((t-b(2)-B)/.2); aj.style.opacity=t>=b(2)+B?1:0; aj.style.transform=`translateY(${(1-q)*80}px)`;
    const p=$('#scribble path'); const L=2600; p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-eo((t-b(2)-2*B)/.3));
    const h=$('#hip'); pop(h,t,b(2)+3*B,.2); h.style.transform+=` rotate(${-6+Math.sin(t*6)*2}deg)`;
    tagEls.forEach(({d,r,at})=>{pop(d,t,at,.2);d.style.transform+=` rotate(${r}deg)`;});
    const out=expoIn((t-b(4)+.25)/.25); $('#s3').style.transform=`translateY(${-out*1920}px)`;
  }
  // S4
  if(t>=b(4)&&t<b(6)){
    pop($('#s4t'),t,b(4),.6);
    ['#w1','#w2','#w3','#w4','#w5'].forEach((s,i)=>{const e=$(s);const at=b(4)+B*(i+1);const q=spring((t-at)*1.5);e.style.opacity=t>=at?1:0;e.style.transform=`translateY(${(1-q)*200}px) scale(${lerp(.6,1,q)}) rotate(${(1-q)*(i%2?6:-6)}deg)`;});
    $('#prog').style.width=clamp((t-b(4)-B*3)/(BAR*1.2))*100+'%';
    const z=expoIn((t-b(6)+.35)/.35); $('#s4').style.transform=`scale(${1+z*3})`; $('#s4').style.transformOrigin='50% 53%'; $('#s4').style.opacity=1-z;
  }
  // S5
  if(t>=b(6)&&t<b(8)){
    chatEls.forEach(({d,typing,at})=>{const tyA=at-B*.9; typing.style.opacity=(t>=tyA&&t<at)?1:0;
      typing.querySelectorAll('.dt').forEach((x,i)=>x.style.opacity=.3+.7*(Math.sin((t-i*.12)*14)>.3?1:0));
      const s=spring((t-at)*1.7); d.style.opacity=t>=at?1:0; d.style.transform=`scale(${lerp(.5,1,s)})`; d.style.transformOrigin=d.style.left?'left bottom':'right bottom';});
    const la=b(7)+B*1.3; const ls=spring((t-la)*1.5); link.style.opacity=t>=la?1:0; link.style.transform=`translateY(${(1-ls)*120}px) scale(${lerp(.7,1,ls)})`;
    pop(react,t,b(7)+B*3,.2);
  }
  // S6
  if(t>=b(8)&&t<b(10)){
    const step=B/2;
    swEls.forEach((c,i)=>{const at=b(8)+i*step; const q=eo5((t-at)/.22); const dir=i%2?1:-1;
      c.style.transform=t<at?`translateY(${i*14}px) scale(${1-i*.02})`:`translate(${dir*q*1300}px,${-q*500}px) rotate(${dir*q*28}deg)`;
      c.style.opacity=q>=1?0:1;});
    const kq=spring((t-b(9))*1.5); keep.style.transform=`scale(${lerp(.9,1,kq)})`;
    const s1=$('#sw1'); const a1=eo5((t-b(8))/.2); s1.style.opacity=a1; s1.style.transform=`translateY(${(1-a1)*-60}px)`;
    const s2=$('#sw2'); pop(s2,t,b(9),.4);
  }
  // S7
  if(t>=b(10)&&t<b(12)){
    todoEls.forEach(({d,at},i)=>{const q=eo5((t-(at-B*.6))/.25); d.style.opacity=q; d.style.transform=`translateX(${(1-q)*-120}px)`;
      const box=d.querySelector('.box'); const on=t>=at; box.style.background=on?'var(--red)':'transparent'; box.style.borderColor=on?'var(--red)':'rgba(237,234,228,.5)'; box.style.color='#fff';
      box.textContent=on?'✓':''; box.style.transform=`scale(${1+pulse(t,at,.25)*.35})`;});
  }
  // S8
  if(t>=b(12)&&t<b(14)){
    const p=clamp((t-b(12))/(2*BAR)); const ang=(t-b(12))*70+ei(p)*420;
    ringEls.forEach((d,i)=>{d.style.transform=`rotateX(-8deg) rotateY(${ang+i*360/RN}deg) translateZ(560px)`;});
    $('#ring').style.transform=`scale(${lerp(.7,1.05,eo(p))})`;
    mqEls.forEach((d,i)=>{const sp=(i%2?1:-1)*(500+ei(p)*1100); d.style.transform=`translateX(${(((t-b(12))*sp)%1400)-1400*(i%2?1:0)}px)`;});
    $('#s8').style.background=(Math.floor((t-b(13))/(B/2))%2===0&&t>=b(13)+2*B)?'#262523':'#141413';
  }
  // S9
  if(t>=b(14)&&t<b(16)){
    const k8=Math.floor((t-b(14))/(B/2));
    repEls.forEach((d,j)=>{const inv=(k8+j)%4===0&&(j<3||j>7); d.style.color=inv?'var(--red)':'rgba(255,255,255,.05)';
      d.style.transform=`translateX(${(j%2?-1:1)*((t-b(14))*260)%600}px)`;});
    const bg=$('#big'); const s=spring((t-b(14))*1.3); bg.style.transform=`scale(${lerp(1.8,1,s)})`; bg.style.opacity=clamp((t-b(14))/.05);
    stkEls.forEach(({d,r,at})=>{pop(d,t,at,.2);d.style.transform+=` rotate(${r+Math.sin(t*5+r)*2}deg)`;});
  }
  // S10
  if(t>=b(16)){
    const e1=$('#e1'); const s=spring((t-b(16))*1.2); e1.style.transform=`scale(${lerp(1.4,1,s)})`; e1.style.opacity=clamp((t-b(16))/.06);
    pop($('#e2'),t,b(16)+B,.4); pop($('#e3'),t,b(16)+2*B,.4); $('#e4').style.opacity=eo((t-b(16)-3*B)/.4)*.8;
    const tp=t-(b(16)+3.5*B); const tap=$('#tap'); tap.style.opacity=tp>0&&tp<.5?1-tp/.5:0; tap.style.transform=`scale(${lerp(.3,1.8,eo(tp/.5))})`;
    $('#cta').style.transform=`scale(${1-pulse(t,b(16)+3.5*B,.2)*.08})`;
    $('#cam').style.filter=`brightness(${1-clamp((t-29.6)/.4)})`;
  } else $('#cam').style.filter='none';
};
window.SIZE=[1080,1920];
window.DURATION=30;
window.render(0);
</script>
</body>
</html>
